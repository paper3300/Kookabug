# 네이티브 파일 라이선스 표 (tools/native_audit.py, 구현 계획 M1 2.12)
#
# 배포물의 DLL·pyd·exe는 전부 여기 항목에 맞아야 한다. 맞는 항목이 없으면 감사 실패다.
#
# [[native]]
# - glob: scope 기준 상대 경로 glob (대소문자 무시, `**`·`{a,b}` 가능). 먼저 적은 항목이 이긴다
# - scope: site-packages (기본, site-packages 기준) | install (설치 폴더 기준)
# - package: 그 파일을 가져온 배포물 (PyPI 이름 또는 python-build-standalone 등)
# - license: 그 파일에 들어 있는 **구성요소 전부**의 SPDX 식. AND의 모든 부분이 허용이어야 한다.
#   조건부 라이선스(MPL-2.0)는 이 항목의 reason을 예외 근거로 삼는다 (패키지 이름별 예외 대신)
# - components: 구성요소와 라이선스 (사람이 읽는 설명, NOTICES에 싣는다)
# - reason: 이 판정의 근거 (필수)
# - [[native.texts]]: 구성요소 라이선스 원문. 식의 모든 잎(OR는 하나)이 어떤 원문의 covers에
#   들어 있어야 한다(고지문 있는 LicenseRef는 그 고지문으로 덮임). 원문마다
#     path(배포물 안, 같은 scope 기준 glob) 또는 file(레포, 이 표 폴더 기준) 하나,
#     covers(덮는 잎: `ID` 또는 `ID WITH 예외`), expect(원문에 반드시 있어야 하는 글귀)
#   원문이 없거나 글귀가 없으면 감사 실패. 원문은 NOTICES에 그대로 싣는다
# - sbom: Rust 확장의 동봉 SBOM glob. 크레이트마다 라이선스를 판정하고 texts에 그 크레이트의
#   원문 절이 있어야 한다 (tools/fetch_crate_licenses.py가 third_party_licenses/에 모은다)
# - sbom_file: 배포물에 SBOM이 없는 바이너리(uv 실행기)의 SBOM을 레포에 둔 것 (이 표 폴더 기준).
#   판정은 sbom과 같다
#
# [[strip]] 설치본에서 빼는 파일·폴더. 빌드 입력에서는 반드시 무언가를 맞혀야 하고(빗나가면 실패),
# 최종 트리에는 남아 있으면 안 된다. origin = wheel(감사 venv에도 있음) | pbs(Python 배포본)
#
# [licenseref."LicenseRef-..."] SPDX 밖 배포 조건. 원문 위치(source)와 처리 근거(reason) 필수.
# LicenseRef는 이 표의 항목에서만 허용된다 (패키지 메타데이터에서는 미상)
#
# install scope 항목은 설치 파일 빌드(tools/installer/build.py)가 스테이징 트리(빌드 입력 감사)와
# 최종 트리에, CI installer 잡이 무인 설치 결과에 건다. python/LICENSE.txt에 없는 PBS 구성요소의
# 원문은 third_party_licenses/python-build-standalone.txt에 모았다.

# ---------------------------------------------------------------- numpy

[[native]]
glob = "numpy.libs/libscipy_openblas*.dll"
package = "numpy"
license = "BSD-3-Clause AND BSD-3-Clause-Open-MPI AND GPL-3.0-or-later WITH GCC-exception-3.1"
components = "OpenBLAS (BSD-3-Clause), LAPACK (BSD-3-Clause-Open-MPI), GCC 런타임 라이브러리 libgfortran 등 (GPL-3.0-or-later WITH GCC-exception-3.1)"
reason = "numpy LICENSE.txt의 Name/Files/License 절이 이 DLL의 세 구성요소를 적는다. GCC 런타임은 numpy 한정 패키지 예외(license-allowlist.toml package_with)"

[[native.texts]]
path = "numpy-*.dist-info/licenses/LICENSE.txt"
covers = ["BSD-3-Clause", "BSD-3-Clause-Open-MPI", "GPL-3.0-or-later WITH GCC-exception-3.1"]
expect = ["Name: OpenBLAS", "Name: LAPACK", "GCC RUNTIME LIBRARY EXCEPTION"]

[[native]]
glob = "numpy.libs/msvcp140-*.dll"
package = "numpy"
license = "LicenseRef-MS-VC-Redist"
components = "Microsoft Visual C++ 런타임 (wheel 빌드 도구 delvewheel이 이름을 바꿔 넣음)"
reason = "Visual C++ 재배포 가능 파일. 수정하지 않고 numpy가 넣은 그대로 배포한다. 고지는 LicenseRef 정의"

[[native]]
glob = "numpy/**/*.pyd"
package = "numpy"
license = "BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0"
components = "NumPy (BSD-3-Clause), pythoncapi-compat (0BSD), dragon4·pcg64·sfc64 (MIT), libdivide (Zlib), splitmix64 (CC0-1.0), pocketfft·highway·SVML·x86-simd-sort 등 (BSD-3-Clause)"
reason = "numpy 메타데이터 License-Expression이 확장 모듈에 들어간 구성요소 전체를 적고, 각 원문이 dist-info/licenses 아래에 있다"

[[native.texts]]
path = "numpy-*.dist-info/licenses/**/*"
covers = ["BSD-3-Clause", "0BSD", "MIT", "Zlib", "CC0-1.0"]
expect = ["NumPy Developers", "BSD Zero Clause License", "Ryan Juckett", "zlib License", "To the extent possible under law"]

