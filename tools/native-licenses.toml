# ---------------------------------------------------------------- Electron 44.8.0 (설치본, M2)
#
# electron-builder가 Electron 배포물(node_modules/electron/dist)을 복사하고 electron.exe를
# Kookabug.exe로 바꾼다. LICENSES.chromium.html(Chromium credits, 약 20 MB)은 모든 빌드 구성(Android·
# Linux·macOS 포함)의 합집합이라, Windows 파일에 들어가는 구성요소의 라이선스를 식으로 적고 원문은 그
# 파일 전체다. 크기 때문에 NOTICES에 옮겨 싣지 않고 위치만 적는다(embed = false, 설치 폴더에 그대로
# 있다). 식에 없는 나머지 credits(자체 허용 문구: fdlibm·Ooura FFT 등)는 LicenseRef-Chromium-Credits

[[native]]
scope = "install"
glob = "{Kookabug,KookabugTest}.exe"
package = "electron"
license = "MIT AND BSD-3-Clause AND BSD-2-Clause AND Apache-2.0 AND (Apache-2.0 WITH LLVM-exception) AND ISC AND Zlib AND IJG AND Unicode-3.0 AND BSL-1.0 AND CC0-1.0 AND MPL-2.0 AND (FTL OR GPL-2.0-or-later) AND LicenseRef-sqlite-blessing AND LicenseRef-Chromium-Credits"
components = "Electron (MIT), Node.js (MIT), Chromium·Blink·V8·Skia·ANGLE·WebRTC·PDFium (BSD-3-Clause), BoringSSL (ISC·OpenSSL 계열 허용 문구), abseil·Dawn·SwiftShader 일부 (Apache-2.0), libc++·libc++abi (Apache-2.0 WITH LLVM-exception), zlib·brotli·libjpeg-turbo (Zlib·IJG·BSD), ICU (Unicode-3.0), dragonbox (BSL-1.0), Eigen·hunspell (MPL-2.0), FreeType (FTL 선택), SQLite (공개 도메인)"
reason = "Electron 44.8.0(Chromium 152.0.7977.167)의 실행 파일. 정적으로 들어간 구성요소의 원문은 함께 배포되는 LICENSES.chromium.html과 LICENSE.electron.txt다. 조건부인 MPL-2.0 구성요소(Eigen·hunspell)는 수정 없이 컴파일된 것이고 소스는 Chromium 저장소에 있다"

[[native.texts]]
path = "LICENSE.electron.txt"
covers = ["MIT"]
expect = ["Electron contributors"]

[[native.texts]]
path = "LICENSES.chromium.html"
embed = false
covers = ["BSD-3-Clause", "BSD-2-Clause", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "ISC", "Zlib", "IJG", "Unicode-3.0", "BSL-1.0", "CC0-1.0", "MPL-2.0", "FTL", "LicenseRef-Chromium-Credits"]
expect = ["V8 JavaScript Engine", "Node.js", "BoringSSL", "Skia", "LLVM Exceptions", "Independent JPEG Group", "UNICODE LICENSE V3", "Boost Software License", "Mozilla Public License", "The FreeType Project", "Takuya OOURA"]

[[native]]
scope = "install"
glob = "ffmpeg.dll"
package = "electron"
license = "LGPL-2.1-or-later AND BSD-3-Clause"
components = "FFmpeg (LGPL-2.1-or-later, Chromium third_party/ffmpeg, GPL·nonfree 구성 없음: CONFIG_GPL 0·CONFIG_NONFREE 0·CONFIG_VERSION3 0), libopus (BSD-3-Clause)"
reason = "Electron이 시작할 때 필요해 뺄 수 없다(release.gn is_component_ffmpeg = true로 동적 라이브러리). 금지 라이선스이므로 license-allowlist.toml [[pinned_binary]]의 Electron 판·경로·sha256 묶음 예외가 정확히 맞을 때만 허용한다. 수정 없이 배포하고 대응 소스·패치·빌드 정보는 licenses/ffmpeg-SOURCE.txt"

