[project]
name = "kookabug-nodes"
version = "0.1.0.dev0"
description = "Kookabug 코어 노드"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = ["kookabug-sdk"]

[tool.kookabug]
id = "core"
title = "Kookabug 코어"
modules = [
    "kookabug_nodes.graph",
    "kookabug_nodes.test",
    "kookabug_nodes.flow",
    "kookabug_nodes.values",
    "kookabug_nodes.log",
    "kookabug_nodes.app",
    "kookabug_nodes.window",
    "kookabug_nodes.input",
    "kookabug_nodes.image",
    "kookabug_nodes.screen",
    "kookabug_nodes.assert_",
    "kookabug_nodes.ocr",
]
# 노드 effects는 여기에 있어야 한다 (앱·창 = process, 입력 = input, 화면·이미지·OCR·글자 입력의 칸
# 찾기 = capture)
permissions = ["capture", "input", "process"]

[tool.uv.sources]
kookabug-sdk = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
