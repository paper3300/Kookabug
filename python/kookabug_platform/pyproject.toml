[project]
name = "kookabug-platform"
version = "0.1.0.dev0"
description = "Kookabug Windows 플랫폼 (창·캡처·입력·비전·OCR)"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
# Windows에서만 쓴다. 버전은 uv.lock이 고정하고 여기는 하한 + 주 버전 상한
dependencies = [
    "numpy>=2.5,<3; sys_platform == 'win32'",
    "onnxruntime>=1.31,<2; sys_platform == 'win32'",
    "opencv-python>=5.0,<6; sys_platform == 'win32'",
    "pyclipper>=1.4,<2; sys_platform == 'win32'",
    "windows-capture>=2.0.1,<3; sys_platform == 'win32'",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
