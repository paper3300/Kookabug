# OCR 모델 고정 표 (구현 계획 M1 2.6). 모델 파일은 git에 넣지 않는다.
# `tools/fetch_ocr_models.py`가 `build/ocr-models/`에 받아 크기·SHA256을 확인하고, 실행 중에는 내려받지 않는다.
#
# [[model]]  모델 하나 (감사 `tools/native_audit.py`도 이 표를 읽는다)
#   role          det | rec
#   file          모델 폴더 안 파일 이름
#   sha256, size  RapidOCR v3.10.0 `default_models.yaml`의 SHA256과 같다
#   license       SPDX 식
#   license_texts 아래 [[text]] 중 이 모델의 라이선스 근거 원문
#   source        출처 (원본 모델 → 변환본)
#   url           받는 주소 (RapidOCR v3.10.0 태그), mirrors = 보조 주소 (같은 바이트여야 한다)
#
# [[text]]  라이선스 근거 원문. 모델과 함께 받고 NOTICES에 원문을 싣는다

