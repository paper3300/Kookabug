[project]
name = "kookabug-mcp"
version = "0.1.0.dev0"
description = "Kookabug MCP 서버 (kookabug mcp: 에이전트 CLI ↔ 워크스페이스 daemon, stdio)"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
# MCP는 표준 라이브러리로 직접 구현한다 (M5 계획 D1, 새 의존성 없음). daemon 연결은 kookabug-daemon
# 클라이언트, 도구 입력 검사는 kookabug-core가 쓰는 jsonschema
dependencies = ["jsonschema>=4.25", "kookabug-core", "kookabug-daemon"]

[tool.uv.sources]
kookabug-core = { workspace = true }
kookabug-daemon = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
