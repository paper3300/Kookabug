[project]
name = "kookabug-cli"
version = "0.1.0.dev0"
description = "Kookabug 명령줄 도구 (kookabug run·target test·screen test)"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
# target test·screen test는 kookabug-platform(opencv)을 쓴다. 의존성으로 두지 않고 그 명령을 쓸
# 때만 import한다 — 없으면 종료 코드 6과 안내. 설치 파일(M1 T13)은 둘 다 넣는다
dependencies = ["kookabug-core", "kookabug-sdk"]

[project.scripts]
kookabug = "kookabug_cli.main:main"

[tool.uv.sources]
kookabug-core = { workspace = true }
kookabug-sdk = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
