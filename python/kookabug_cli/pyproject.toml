[project]
name = "kookabug-cli"
version = "0.1.0.dev0"
description = "Kookabug 명령줄 도구 (kookabug run)"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = ["kookabug-core", "kookabug-sdk"]

[project.scripts]
kookabug = "kookabug_cli.main:main"

[tool.uv.sources]
kookabug-core = { workspace = true }
kookabug-sdk = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
