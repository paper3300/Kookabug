<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>환경 점검</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1F1F1F}
a{color:#4DAAFC}a:hover{color:#7CC0FF}
button,input,select,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 1120px; height: 720px; box-sizing: border-box; overflow: hidden; border-radius: 10px; background: #1F1F1F; color: #CCCCCC; font-family: 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif; font-size: 14px; display: flex">

  <div style="flex: 0 0 560px; box-sizing: border-box; padding: 52px 44px 28px 52px; display: flex; flex-direction: column">
    <div style="font-size: 12px; color: #9D9D9D; letter-spacing: .04em">3 / 7 · 환경 점검</div>
    <h1 style="margin: 10px 0 0; font-size: 30px; line-height: 1.3; font-weight: 700; color: #F3F3F3">제대로 보고 누를 수 있는지 확인할게요</h1>
    <p style="margin: 12px 0 0; font-size: 15px; line-height: 1.65; color: #A9A9A9">게임 창에서 화면 캡처, 글자 읽기, 입력을 한 번씩 시험했어요.</p>

    <ul style="list-style: none; margin: 22px 0 0; padding: 0; display: flex; flex-direction: column; border: 1px solid #3C3C3C; border-radius: 8px; overflow: hidden; background: #232323">
      <sc-for list="{{checks}}" as="c" hint-placeholder-count="5">
        <li style="display: flex; gap: 12px; padding: 11px 14px; border-bottom: 1px solid #2E2E2E; background: {{c.bg}}">
          <span aria-label="{{c.label}}" role="img" style="flex: 0 0 20px; height: 20px; margin-top: 1px; border-radius: 50%; background: {{c.ibg}}; color: {{c.ifg}}; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{c.icon}}</span>
          <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <span style="color: #E7E7E7; font-weight: 600">{{c.title}}</span>
            <span style="font-size: 13px; line-height: 1.5; color: #A9A9A9">{{c.detail}}</span>
            <sc-if value="{{c.action}}" hint-placeholder-val="{{ false }}">
              <button type="button" style="align-self: flex-start; margin-top: 4px; height: 30px; padding: 0 12px; background: #4A3B1C; color: #F2D9A8; border: 1px solid #6B5320; border-radius: 4px; font-size: 13px">{{c.action}}</button>
            </sc-if>
          </span>
        </li>
      </sc-for>
    </ul>
    <button type="button" style="margin-top: 12px; align-self: flex-start; height: 30px; padding: 0 12px; background: #313131; color: #CCCCCC; border: 1px solid #3C3C3C; border-radius: 4px; font-size: 13px">다시 점검</button>

    <div style="flex: 1 1 auto"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <a href="Setup2Game.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; background: #2A2A2A; color: #CCCCCC; border-radius: 6px; font-size: 15px; text-decoration: none"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 3L5 8l5 5"></path></svg>이전</a>
      <div aria-hidden="true" style="display: flex; align-items: center; gap: 6px">
        <sc-for list="{{dots}}" as="d" hint-placeholder-count="7"><span style="width: {{d.w}}; height: 6px; border-radius: 3px; background: {{d.c}}"></span></sc-for>
      </div>
      <a href="Setup4Accounts.dc.html" style="display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 18px; background: #0078D4; color: #FFFFFF; border-radius: 6px; font-size: 15px; font-weight: 600; text-decoration: none">계속 <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M13 3v5a2 2 0 0 1-2 2H4"></path><path d="M6.5 7.5L4 10l2.5 2.5"></path></svg></a>
    </div>
  </div>

  <div style="flex: 1 1 auto; margin: 16px 16px 16px 0; border-radius: 8px; background-color: #181818; background-image: radial-gradient(#2A2A2A 1px, transparent 1px); background-size: 16px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
    <div style="position: relative; width: 440px; height: 248px; background: #141414; border: 1px solid #3C3C3C; border-radius: 4px; overflow: hidden" role="img" aria-label="점검에 쓴 게임 화면. 시작하기 버튼 글자를 읽었고 신뢰도 0.98">
      <div style="position: absolute; left: 0; right: 0; top: 0; height: 60%; background: #1C2430"></div>
      <div style="position: absolute; left: 50%; top: 26%; transform: translateX(-50%); font-size: 26px; font-weight: 700; color: #6F8FB3; letter-spacing: .06em">SampleRPG</div>
      <div style="position: absolute; left: 50%; top: 66%; transform: translateX(-50%); width: 120px; height: 30px; border-radius: 4px; background: #2D3B4D; border: 1px solid #4F6782; display: flex; align-items: center; justify-content: center; color: #D5E3F3; font-size: 13px">시작하기</div>
      <div style="position: absolute; left: 152px; top: 157px; width: 136px; height: 44px; border: 2px solid #CCA700; border-radius: 3px"></div>
      <div style="position: absolute; left: 292px; top: 160px; padding: 1px 6px; background: #CCA700; color: #181818; font-size: 11px; font-family: 'JetBrains Mono', monospace">시작하기 0.98</div>
      <div style="position: absolute; left: 30px; top: 18px; width: 70px; height: 18px; border: 1px dashed #39C5CF"></div>
      <div style="position: absolute; left: 30px; top: 40px; font-size: 10px; color: #39C5CF; font-family: 'JetBrains Mono', monospace">v1.0.3 0.91</div>
    </div>
    <div style="width: 440px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
        <div style="padding: 10px 12px; background: #232323; border: 1px solid #333333; border-radius: 6px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 11px; color: #9D9D9D">{{s.k}}</span>
          <span style="font-size: 15px; color: #E7E7E7; font-weight: 600">{{s.v}}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = 3;
    const dots = [1, 2, 3, 4, 5, 6, 7].map((i) => ({ w: i === cur ? '20px' : '6px', c: i <= cur ? '#E7E7E7' : '#4A4A4A' }));
    const ok = { icon: '✓', ibg: '#1E3D2F', ifg: '#89D185', label: '통과', bg: 'transparent', action: '' };
    return {
      dots,
      checks: [
        { ...ok, title: '화면 캡처', detail: 'WGC로 창만 캡처해요. 검은 프레임 없음.' },
        { ...ok, title: '글자 읽기 (OCR)', detail: 'RapidOCR 한국어 모델로 "시작하기"를 읽었어요.' },
        { ...ok, title: '화면 배율', detail: 'DPI 100%. 좌표를 따로 맞출 필요가 없어요.' },
        { icon: '!', ibg: '#4A3B1C', ifg: '#E2C08D', label: '경고', bg: '#26221A', title: '입력 전달', detail: '게임이 관리자 권한으로 실행 중이에요. Kookabug도 관리자 권한이어야 클릭이 들어가요.', action: '관리자 권한으로 다시 시작' },
        { icon: 'i', ibg: '#12324D', ifg: '#7CC0FF', label: '안내', bg: 'transparent', title: '창 모드', detail: '전체화면은 캡처가 끊길 수 있어요. 테두리 없는 창 모드를 권장해요.', action: '' }
      ],
      stats: [{ k: '캡처', v: '60 fps' }, { k: 'OCR 영역', v: '2개 읽음' }, { k: '점검 결과', v: '통과 3 · 경고 1' }]
    };
  }
}
</script>
</body>
</html>
