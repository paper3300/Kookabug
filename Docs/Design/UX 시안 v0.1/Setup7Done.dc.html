<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>설정 완료</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1F1F1F}
a{color:#4DAAFC}a:hover{color:#7CC0FF}
button,input,select,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 1120px; height: 720px; box-sizing: border-box; overflow: hidden; border-radius: 10px; background: #1F1F1F; color: #CCCCCC; font-family: 'Segoe UI', 'Noto Sans KR', system-ui, sans-serif; font-size: 14px; display: flex">

  <div style="flex: 0 0 560px; box-sizing: border-box; padding: 52px 44px 28px 52px; display: flex; flex-direction: column">
    <div style="font-size: 12px; color: #9D9D9D; letter-spacing: .04em">7 / 7 · 완료</div>
    <h1 style="margin: 10px 0 0; font-size: 30px; line-height: 1.3; font-weight: 700; color: #F3F3F3">준비됐어요</h1>
    <p style="margin: 12px 0 0; font-size: 15px; line-height: 1.65; color: #A9A9A9">설정은 언제든 환경설정에서 바꿀 수 있어요.</p>

    <dl style="margin: 20px 0 0; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px 12px; font-size: 13px; line-height: 1.5">
      <sc-for list="{{summary}}" as="s" hint-placeholder-count="6">
        <dt style="color: #9D9D9D">{{s.k}}</dt>
        <dd style="margin: 0; color: {{s.c}}">{{s.v}}</dd>
      </sc-for>
    </dl>

    <div style="margin-top: 20px; font-size: 13px; color: #BBBBBB" id="first">처음 할 일</div>
    <div role="radiogroup" aria-labelledby="first" style="margin-top: 8px; border: 1px solid #3C3C3C; border-radius: 8px; overflow: hidden; background: #232323">
      <sc-for list="{{firsts}}" as="f" hint-placeholder-count="3">
        <label style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #2E2E2E; background: {{f.bg}}">
          <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 1px"><span style="color: #E7E7E7; font-weight: 600">{{f.t}}</span><span style="font-size: 13px; color: #A9A9A9">{{f.d}}</span></span>
          <input type="radio" name="first" checked="{{f.sel}}" style="width: 18px; height: 18px; accent-color: #0078D4">
        </label>
      </sc-for>
    </div>

    <div style="flex: 1 1 auto"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <a href="Setup6Record.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; background: #2A2A2A; color: #CCCCCC; border-radius: 6px; font-size: 15px; text-decoration: none"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 3L5 8l5 5"></path></svg>이전</a>
      <div aria-hidden="true" style="display: flex; align-items: center; gap: 6px">
        <sc-for list="{{dots}}" as="d" hint-placeholder-count="7"><span style="width: {{d.w}}; height: 6px; border-radius: 3px; background: {{d.c}}"></span></sc-for>
      </div>
      <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 18px; background: #0078D4; color: #FFFFFF; border-radius: 6px; font-size: 15px; font-weight: 600; text-decoration: none">Kookabug 열기 <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M13 3v5a2 2 0 0 1-2 2H4"></path><path d="M6.5 7.5L4 10l2.5 2.5"></path></svg></a>
    </div>
  </div>

  <div style="flex: 1 1 auto; margin: 16px 16px 16px 0; border-radius: 8px; background-color: #181818; background-image: radial-gradient(#2A2A2A 1px, transparent 1px); background-size: 16px 16px; position: relative; overflow: hidden">
    <div aria-hidden="true" style="position: absolute; left: 36px; right: -60px; top: 90px; bottom: -40px; display: flex; background: #181818; border: 1px solid #333333; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.4)">
      <div style="flex: 0 0 36px; border-right: 1px solid #2B2B2B; display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 12px">
        <span style="width: 14px; height: 14px; border-radius: 3px; background: #3A3A3A"></span>
        <span style="width: 14px; height: 14px; border-radius: 3px; background: #2C2C2C"></span>
        <span style="width: 14px; height: 14px; border-radius: 3px; background: #2C2C2C"></span>
      </div>
      <div style="flex: 0 0 130px; border-right: 1px solid #2B2B2B; padding: 14px 12px; display: flex; flex-direction: column; gap: 9px">
        <span style="font-size: 10px; color: #9D9D9D">SAMPLE-RPG</span>
        <span style="font-size: 11px; color: #BBBBBB">tests</span>
        <span style="font-size: 11px; color: #BBBBBB">subgraphs</span>
        <span style="font-size: 11px; color: #BBBBBB">targets</span>
        <span style="font-size: 11px; color: #BBBBBB">screens</span>
      </div>
      <div style="position: relative; flex: 1 1 auto; background-color: #1F1F1F; background-image: radial-gradient(#2C2C2C 1px, transparent 1px); background-size: 14px 14px">
        <div style="position: absolute; left: 40px; top: 40px; width: 110px; height: 56px; border-radius: 4px; background: #252526; border: 1px solid #3C3C3C"><div style="height: 16px; border-radius: 3px 3px 0 0; background: #333333"></div></div>
        <div style="position: absolute; left: 190px; top: 80px; width: 110px; height: 56px; border-radius: 4px; background: #252526; border: 2px solid #0078D4"><div style="height: 16px; border-radius: 2px 2px 0 0; background: #A1260D"></div></div>
        <div style="position: absolute; left: 150px; top: 68px; width: 40px; height: 2px; background: #555555"></div>
        <div style="position: absolute; left: 190px; top: 148px; font-size: 11px; color: #9D9D9D">녹화 시작 대기</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = 7;
    const dots = [1, 2, 3, 4, 5, 6, 7].map((i) => ({ w: i === cur ? '20px' : '6px', c: i <= cur ? '#E7E7E7' : '#4A4A4A' }));
    const s = (k, v, c) => ({ k, v, c: c || '#E7E7E7' });
    return {
      dots,
      summary: [
        s('프로젝트', 'sample-rpg · D:\\QA\\sample-rpg'),
        s('게임', 'SampleRPG · 1280×720 · WGC'),
        s('환경 점검', '통과 3 · 경고 1 (관리자 권한)', '#E2C08D'),
        s('테스트 계정', '2개 · 자격 증명 관리자'),
        s('에이전트', 'Claude Code · 그래프 작성'),
        s('기록', '스크린샷 켬 · 영상 실패만 · 14일 / 60일')
      ],
      firsts: [
        { t: '녹화로 첫 테스트 만들기', d: '게임을 직접 해 보면 노드로 바뀌어요', bg: '#04395E', sel: true },
        { t: '에이전트에게 맡기기', d: '하고 싶은 테스트를 말로 설명해요', bg: 'transparent', sel: false },
        { t: '빈 에디터로 시작', d: '노드를 직접 배치해요', bg: 'transparent', sel: false }
      ]
    };
  }
}
</script>
</body>
</html>
