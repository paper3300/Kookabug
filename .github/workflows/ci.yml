name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.6"
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  python:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      # 값 왕복 검사(M2 계획 2.6)가 Node로 packages/schema/src/wire.ts를 그대로 불러 쓴다 (타입 제거 실행)
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: uv sync --locked --all-packages
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      # OCR 모델 (구현 계획 M1 2.6): 모델 표가 바뀌지 않으면 캐시. 받은 뒤에도 해시를 다시 확인한다
      - uses: actions/cache@v4
        with:
          path: build/ocr-models
          key: ocr-models-${{ hashFiles('python/kookabug_platform/src/kookabug_platform/ocr/models.toml') }}
      - run: uv run python tools/fetch_ocr_models.py
      # packaging 표시 테스트(wheel 빌드·깨끗한 venv·라이선스 파이프라인)도 건너뛰지 않는다.
      # 설치 파일 무인 설치 검사(M1 인수 4 포함)는 installer 잡이 빌드한 설치 파일로 돈다.
      # 데스크톱 검사는 auto(호스트 러너 탐지 실패면 건너뜀, 수·이유는 잡 요약 — M1 2.13 방침 (b))
      # pnpm·앱 빌드가 필요한 검사(desktop_build)는 desktop 잡이 돌린다
      - run: >-
          uv run pytest --ignore=tools/tests/test_installer_e2e.py
          --deselect python/kookabug_core/tests/acceptance/test_m1.py::test_installed_cli_runs_capture_and_ocr_without_python
          -m "not desktop_build"

  codegen:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      # pnpm 버전은 package.json의 packageManager에서 읽는다
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --all-packages
      # 생성 단계: 메타스키마 → JSON 복사·pydantic(gen_schema.py), TS(pnpm gen), 코어 노드 스키마(build)
      - run: uv run python tools/gen_schema.py
      - run: pnpm -r run gen
      - run: uv run kookabug-sdk build python/kookabug_nodes
      # 새로 생긴 미추적 생성물도 잡도록 status까지 본다
      - name: 생성물 드리프트 검사
        shell: bash
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - run: pnpm -r run typecheck
      # 전송 코덱·daemon-rpc 런타임 검사·말뭉치 (M2 계획 2.6·2.10)
      - run: pnpm --filter @kookabug/schema test

  # 데스크톱 앱 (구현 계획 M2 2.13): 타입 검사 → vitest → 앱 빌드 → 시안 렌더러 검사·기준 PNG·역할 토큰
  # → 감사 범위 검사(desktop_build) → Electron E2E. 호스트 러너에서 Electron 창이 뜨는지는 E2E 스모크가
  # 실측한다. 안 뜨면 E2E는 조율자 PC 필수 실행으로 돌린다 (M2 Q11)
  desktop:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Electron 44는 설치 스크립트가 없다. 고정판 바이너리를 받아 둔다 (@electron/get 캐시)
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @kookabug/desktop exec install-electron
      - run: pnpm -r typecheck
      # 시안 렌더러 검사(Edge), 기준 PNG와 역할 토큰 (M2 계획 2.12). 앱 vitest(tokens.test.ts)가
      # build/design-ref/tokens.json을 쓰므로 먼저 돌린다
      - run: pnpm --filter @kookabug/design-ref test
      - run: node tools/design-ref/render.mjs
      - run: node tools/design-ref/extract.mjs
      - run: pnpm --filter @kookabug/desktop test
      - run: pnpm --filter @kookabug/desktop build
      - run: uv sync --locked --all-packages
      - run: uv run pytest -m desktop_build -v
      - run: pnpm --filter @kookabug/desktop e2e
      # 시안 대비 스크린샷과 나란히 비교 PNG (artifact로 올린다)
      - run: pnpm --filter @kookabug/desktop shots
      - run: node tools/design-ref/compare.mjs welcome shell-empty
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop
          path: |
            build/design-ref
            build/e2e
            build/ui-shots
            build/ui-compare
          if-no-files-found: warn

  # 호스트 러너에서 WGC·포그라운드(SendInput 전제)가 되는지 실측한다 (구현 계획 M1 2.13 Q1).
  # 탐지 실패는 잡 실패가 아니다: 결과 JSON·잡 요약으로 CI 방침 (a)/(b)를 고른다
  desktop-probe:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --all-packages
      - name: 데스크톱 탐지
        env:
          PYTHONPATH: tools
        run: uv run python -m kb_testing.desktop --json build/desktop-probe.json --summary "$env:GITHUB_STEP_SUMMARY" --no-fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-probe
          path: build/desktop-probe.json
          if-no-files-found: warn

  # 설치 파일 (구현 계획 M1 2.12): 빌드(빌드 입력 감사·최종 트리 감사·NOTICES 포함) → 무인 설치(공백·
  # 한글 경로) → 최종 트리 감사 → Python 없는 환경의 헤드리스 스모크(--version·doctor·예제 그래프·DLL
  # 검사) → 제거 → 폴더·PATH 항목 없음. Inno Setup 6과 Visual Studio VC\Redist는 러너 이미지에 있다
  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --all-packages
      - uses: actions/cache@v4
        with:
          path: build/ocr-models
          key: ocr-models-${{ hashFiles('python/kookabug_platform/src/kookabug_platform/ocr/models.toml') }}
      - run: uv run python tools/fetch_ocr_models.py
      # PBS 배포본. 받은 뒤에도 pbs.toml의 크기·SHA256을 확인한 뒤에만 푼다
      - uses: actions/cache@v4
        with:
          path: build/installer-cache
          key: installer-pbs-${{ hashFiles('tools/installer/pbs.toml') }}
      # 제품 판과, 같은 스테이징으로 만든 테스트 전용 판(다른 AppId·이름·폴더). 무인 설치 검사는
      # 테스트 판만 설치한다
      - name: 설치 파일 빌드
        env:
          PYTHONPATH: tools
        run: uv run python -m installer.build --test-setup
      - name: 무인 설치·감사·스모크·제거
        env:
          KOOKABUG_SMOKE_JSON: build/installer/smoke.json
        run: |
          $b = Get-Content build/installer/build.json -Raw | ConvertFrom-Json
          $env:KOOKABUG_INSTALLER = $b.setups.test.path
          uv run pytest tools/tests/test_installer_e2e.py "python/kookabug_core/tests/acceptance/test_m1.py::test_installed_cli_runs_capture_and_ocr_without_python" -v -s
      - name: 크기 요약
        if: always()
        run: |
          $b = Get-Content build/installer/build.json -Raw | ConvertFrom-Json
          "설치 파일 $([math]::Round($b.setups.product.bytes / 1MB, 1)) MiB, 설치본 $([math]::Round($b.stage.bytes / 1MB, 1)) MiB ($($b.stage.files)개 파일), 빌드 $($b.seconds.total) s" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer
          path: |
            build/installer/dist/*.exe
            !build/installer/dist/kookabug-setup-test-*.exe
            build/installer/build.json
            build/installer/smoke.json
            build/installer/stage/licenses/THIRD_PARTY_NOTICES.txt
          if-no-files-found: warn

  licenses:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # pnpm licenses가 node_modules의 패키지 정보를 읽는다
      - run: pnpm install --frozen-lockfile
      # 모델 해시와 라이선스 근거 원문을 확인하고 원문을 NOTICES에 싣는다
      - uses: actions/cache@v4
        with:
          path: build/ocr-models
          key: ocr-models-${{ hashFiles('python/kookabug_platform/src/kookabug_platform/ocr/models.toml') }}
      - run: uv sync --locked --all-packages
      - run: uv run python tools/fetch_ocr_models.py
      - name: 라이선스 감사
        run: ./tools/license_audit.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-audit
          path: |
            build/audit/THIRD_PARTY_NOTICES.txt
            build/audit/runtime.txt
            build/audit/marker_env.json
            build/audit/py.json
            build/audit/js.json
          if-no-files-found: warn
