name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.6"
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  python:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --all-packages
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      # packaging 표시 테스트(wheel 빌드·깨끗한 venv·라이선스 파이프라인)도 건너뛰지 않는다
      - run: uv run pytest

  codegen:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      # pnpm 버전은 package.json의 packageManager에서 읽는다
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --all-packages
      # 생성 단계: 메타스키마 → JSON 복사·pydantic(gen_schema.py), TS(pnpm gen). T4가 kookabug-sdk build를 추가한다
      - run: uv run python tools/gen_schema.py
      - run: pnpm -r run gen
      # 새로 생긴 미추적 생성물도 잡도록 status까지 본다
      - name: 생성물 드리프트 검사
        shell: bash
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - run: pnpm -r run typecheck

  licenses:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # pnpm licenses가 node_modules의 패키지 정보를 읽는다
      - run: pnpm install --frozen-lockfile
      - name: 라이선스 감사
        run: ./tools/license_audit.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-audit
          path: |
            build/audit/THIRD_PARTY_NOTICES.txt
            build/audit/runtime.txt
            build/audit/marker_env.json
            build/audit/py.json
            build/audit/js.json
          if-no-files-found: warn
